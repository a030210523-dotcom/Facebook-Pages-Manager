# Production deployment (Phase 4) — licensing server + PostgreSQL behind HTTPS.
# 1) cp .env.example .env  and fill real secrets.  2) docker compose up -d
# 3) Put a reverse proxy (Caddy/Nginx) with TLS in front of :8000 — the app must
#    only be reached over HTTPS in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fpm_licenses
      POSTGRES_USER: fpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fpm_pgdata:/var/lib/postgresql/data
      - ./docs/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
  licensing:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q -r licensing_server/requirements.txt && uvicorn licensing_server.main:app --host 0.0.0.0 --port 8000"
    environment:
      FPM_ED25519_PRIVATE_KEY: ${FPM_ED25519_PRIVATE_KEY}
      FPM_ADMIN_TOKEN: ${FPM_ADMIN_TOKEN}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      DATABASE_URL: postgresql://fpm:${POSTGRES_PASSWORD}@db:5432/fpm_licenses
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
volumes:
  fpm_pgdata:
